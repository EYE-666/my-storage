<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个干净、快捷的个人常用网站导航页。">
  <meta name="theme-color" content="#07111f">
  <title>我的起始页</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307111f'/%3E%3Cpath d='M18 34h28M34 18v28' stroke='%236ee7f2' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='20' r='6' fill='%238b5cf6'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 29, 48, 0.72);
      --panel-strong: rgba(19, 37, 61, 0.92);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f4f8ff;
      --muted: #9fb0c8;
      --accent: #6ee7f2;
      --accent-2: #8b5cf6;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 10% 15%, rgba(14, 165, 233, 0.16), transparent 30rem),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.18), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 36px 0 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 52px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(110, 231, 242, 0.35);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(110, 231, 242, 0.08);
      box-shadow: inset 0 0 20px rgba(110, 231, 242, 0.08);
    }

    main {
      align-self: center;
      display: grid;
      grid-template-columns: minmax(240px, 0.75fr) minmax(520px, 1.25fr);
      gap: clamp(44px, 8vw, 112px);
      align-items: center;
    }

    .intro { padding-bottom: 18px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 1px;
      background: currentColor;
    }

    h1 {
      max-width: 520px;
      margin: 0;
      font-size: clamp(2.75rem, 7vw, 5.4rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, var(--accent), #b8a6ff 70%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .intro p {
      max-width: 390px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .site-card {
      --card-accent: var(--accent);
      min-height: 148px;
      position: relative;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .site-card::after {
      content: "";
      position: absolute;
      right: -55px;
      bottom: -70px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--card-accent) 22%, transparent);
      filter: blur(22px);
      transition: transform 180ms ease;
    }

    .site-card:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--card-accent) 55%, transparent);
      background: var(--panel-strong);
    }

    .site-card:hover::after { transform: scale(1.18); }

    .site-card:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--card-accent) 65%, white);
      outline-offset: 4px;
    }

    .site-card.featured {
      grid-column: span 2;
      min-height: 166px;
      flex-direction: row;
      align-items: flex-end;
      background:
        linear-gradient(115deg, rgba(110, 231, 242, 0.13), transparent 55%),
        var(--panel);
    }

    .card-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--card-accent);
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: color-mix(in srgb, var(--card-accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--card-accent) 30%, transparent);
    }

    .open-icon {
      width: 22px;
      height: 22px;
      color: var(--muted);
      transition: color 180ms ease, transform 180ms ease;
    }

    .site-card:hover .open-icon {
      color: var(--text);
      transform: translate(2px, -2px);
    }

    .card-copy { position: relative; z-index: 1; }

    .card-copy h2 {
      margin: 18px 0 5px;
      font-size: 1.05rem;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .card-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.55;
    }

    .featured .card-copy h2 {
      margin-top: 0;
      font-size: 1.35rem;
    }

    .featured .card-top {
      width: auto;
      align-self: flex-start;
    }

    .xidian { --card-accent: #6ee7f2; }
    .service { --card-accent: #60a5fa; }
    .github { --card-accent: #f8fafc; }
    .chatgpt { --card-accent: #5eead4; }
    .huya { --card-accent: #fb923c; }
    .translate { --card-accent: #60a5fa; }

    @media (max-width: 840px) {
      .shell { gap: 36px; }
      main { grid-template-columns: 1fr; gap: 34px; }
      .intro { padding: 0; }
      .intro p { margin-top: 20px; }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 28px, 1120px);
        padding-top: 22px;
      }

      h1 { font-size: clamp(2.55rem, 14vw, 4rem); }
      .links { grid-template-columns: 1fr; }
      .site-card.featured { grid-column: span 1; }
      .site-card, .site-card.featured { min-height: 138px; }
      .site-card.featured { flex-direction: column; align-items: stretch; }
      .featured .card-copy h2 { margin-top: 18px; font-size: 1.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand" aria-label="我的起始页">
        <span class="brand-mark" aria-hidden="true">＋</span>
        <span>MY START</span>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">个人导航</p>
        <h1 id="page-title">今天，<span>从这里开始。</span></h1>
      </section>

      <nav class="links" aria-label="常用网站">
        <a class="site-card xidian" href="https://learning.xidian.edu.cn/portal" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="icon" aria-hidden="true">学</span>
            <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="card-copy">
            <h2>学在西电</h2>
            <p>课程学习与教学资源</p>
          </div>
        </a>

        <a class="site-card translate" href="https://translate.google.com/" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="icon" aria-hidden="true">译</span>
            <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="card-copy">
            <h2>Google 翻译</h2>
            <p>文本、网页与文档翻译</p>
          </div>
        </a>

        <a class="site-card service" href="https://ehall.xidian.edu.cn/new/index_xd.html#/home" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="icon" aria-hidden="true">办</span>
            <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="card-copy">
            <h2>西电一站式服务大厅</h2>
            <p>校内事务与公共服务</p>
          </div>
        </a>

        <a class="site-card github" href="https://github.com/" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="icon" aria-hidden="true">GH</span>
            <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="card-copy">
            <h2>GitHub</h2>
            <p>代码、项目与开源社区</p>
          </div>
        </a>

        <a class="site-card chatgpt" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="icon" aria-hidden="true">AI</span>
            <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="card-copy">
            <h2>ChatGPT</h2>
            <p>提问、创作与解决问题</p>
          </div>
        </a>

        <a class="site-card huya" href="https://www.huya.com/" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="icon" aria-hidden="true">虎</span>
            <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8M9 8h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="card-copy">
            <h2>虎牙直播</h2>
            <p>游戏、赛事与娱乐直播</p>
          </div>
        </a>

      </nav>
    </main>

  </div>
</body>
</html>
